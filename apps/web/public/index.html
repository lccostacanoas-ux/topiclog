<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topic Log</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #0F172A;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #334155;
      border-top-color: #2563EB;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <img src="icons/icon-192.png" width="88" height="88" alt="Topic Log" style="border-radius: 20px; margin-bottom: 20px;">
  <div class="spinner"></div>
  <h2 style="margin: 0 0 8px 0; font-size: 20px; font-weight: 700;">Topic Log</h2>
  <p style="margin: 0; color: #94A3B8; font-size: 14px;">Carregando plataforma de entregas...</p>
  <script>
    if (window.location.pathname.endsWith("index.html")) {
      window.location.replace("/");
    }
  </script>
</body>
</html>
