name: Topic Log CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-verify:
    name: Backend (.NET 10 LTS) Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 LTS
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore TopicLog.sln

      - name: Build solution
        run: dotnet build TopicLog.sln --configuration Release --no-restore

      - name: Run unit and integration tests
        run: dotnet test TopicLog.sln --configuration Release --no-build --verbosity normal
