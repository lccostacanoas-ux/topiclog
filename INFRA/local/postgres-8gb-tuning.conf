# =============================================================================
# Parâmetros Recomendados do PostgreSQL + PostGIS para Desenvolvimento Local
# Hardware alvo: Windows 11, Intel Core i3-7020U (2C/4T), ~8 GB RAM, SSD NVMe
# =============================================================================
# Este arquivo é apenas documental/referência para a instância local nativa.

max_connections = 40
shared_buffers = 128MB
effective_cache_size = 1GB
maintenance_work_mem = 64MB
checkpoint_completion_target = 0.9
wal_buffers = 4MB
default_statistics_target = 100
random_page_cost = 1.1                 # Otimizado para SSD NVMe
effective_io_concurrency = 200         # Otimizado para SSD NVMe
work_mem = 4MB
min_wal_size = 80MB
max_wal_size = 512MB
max_worker_processes = 2               # Alinhado aos 2 núcleos físicos do i3-7020U
max_parallel_workers_per_gather = 1
max_parallel_workers = 2
timezone = 'UTC'
